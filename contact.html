<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="#" class="logo">Portfolio</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="skill.html">Skill</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section class="contact">
        <div class="contact-container">
            <h1>Contact Me</h1>
            <p>If you’d like to collaborate or just say hi, feel free to reach out!</p>

            <div class="contact-info">
                <p><i class='bx bx-envelope'></i> Email: <a href="mailto:kumariafprince@gmail.com">kumariafprince@gmail.com</a></p>
                <p><i class='bx bx-phone'></i> Phone: +91 90088 02105</p>
                <p><i class='bx bx-map'></i> Location: Bangaluru, India</p>
            </div>

            <!-- Contact Form -->
            <form class="contact-form">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn-box">Send Message</button>
            </form>

            <div class="social-links">
                <a href="#"><i class='bx bxl-facebook'></i></a>
                <a href="#"><i class='bx bxl-instagram'></i></a>
                <a href="https://www.linkedin.com/in/prince-kumar-576544374/" 
                    target="_blank" 
                    rel="noopener noreferrer">
                    <i class='bx bxl-linkedin'></i>
                </a>
                <a href="#"><i class='bx bxl-github'></i></a>
            </div>
        </div>
    </section>

    <!-- EmailJS Script -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("-ljUU2i9yoL8ssclo"); // ✅ Replace with your EmailJS Public Key
        })();

        document.querySelector(".contact-form").addEventListener("submit", function(e) {
            e.preventDefault();
            emailjs.sendForm("service_8qfussa", "template_8t5kdur", this)
                .then(() => {
                    alert("✅ Message sent successfully!");
                    this.reset();
                }, (err) => {
                    alert("❌ Failed to send message: " + JSON.stringify(err));
                });
        });
    </script>
</body>
</html>
